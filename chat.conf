# E-INK HACK configuration.
# This file is loaded by chat.sh with ". chat.conf" -- it is shell, not a data format.
# Lines starting with # are comments.

# Text sent to the model.
PROMPT="Once upon a time, there was a little robot"

# How many tokens to generate. The model has a 256 token context, so the prompt
# plus STEPS cannot exceed that. llama2.c clamps to seq_len (256) if you overshoot.
STEPS=80

# Sampling. llama2.c's recommendation for TinyStories is temperature 1.0 with
# top-p 0.9 (do not tune both at once).
TEMP=0.8
TOPP=0.9

# Layout: the line where generated text starts, and where the status (tok/s) goes.
# The KT4 screen is 800x600; adjust if text runs off the panel.
STREAM_LINE=8
STATUS_LINE=28

# Safety: exit on its own after this many seconds if nobody taps.
MAX_WAIT=600

# --- optional: force a specific runner+model pair ---------------------------
# chat.sh decides on its own: it prefers fp32 (llama + stories15M.bin) because
# that measured faster on the KT4, and only falls back to Q8_0 (llama-q8 +
# stories15M_q80.bin, 16 MB instead of 58 MB) when the fp32 pair is missing.
# Uncomment to force a pair:
#
# BIN="$APP_DIR/llama-q8"
# MODEL="$APP_DIR/model/stories15M_q80.bin"
